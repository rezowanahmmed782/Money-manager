<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>Money Manager</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--mute:#76746c;--line:#e6e3da;--acc:#1f6f5c;--out:#c2410c;--red:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151513;--card:#1f1f1c;--ink:#efede6;--mute:#9a978c;--line:#2e2d29;--acc:#4fbf9f;--out:#f08a5d}}
:root[data-theme="dark"]{--bg:#151513;--card:#1f1f1c;--ink:#efede6;--mute:#9a978c;--line:#2e2d29;--acc:#4fbf9f;--out:#f08a5d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:600px;margin:0 auto;padding:12px 14px 110px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.ic{width:42px;height:42px;padding:0;font-size:18px}
.view{display:none}.view.on{display:block}
.big{text-align:center}.big small,.g small{color:var(--mute);display:block;font-size:12px}.big b{display:block;font-size:36px;color:var(--out)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.g b{font-size:17px;word-break:break-word}
.g2{grid-template-columns:1fr 1fr}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 8px}.bar i{display:block;height:100%;background:var(--acc)}.bar.over i{background:var(--red)}
.st{display:flex;justify-content:space-between;font-weight:600;font-size:15px}
.cat{display:flex;justify-content:space-between;font-size:14px}.cb{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:3px 0 10px}.cb i{display:block;height:100%;background:var(--out)}
.tx{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}.tx:first-child{border-top:0}
.tx .m{flex:1;min-width:0}.tx .m div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx small{color:var(--mute)}
.amt{font-weight:600}.amt.e{color:var(--out)}.amt.i{color:var(--acc)}
.x{border:0;background:none;color:var(--mute);padding:8px 10px}
.dh{display:flex;justify-content:space-between;background:var(--bg);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:14px}.dh:first-child{margin-top:0}.dh span{color:var(--out);font-weight:700;font-size:15px}
.empty{color:var(--mute);text-align:center;padding:16px 0}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:6px}.tabs button span{font-size:20px}
.tabs button.on{color:var(--acc);font-weight:700}
.tabs .add{color:#fff}.tabs .add span{background:var(--acc);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-top:-22px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-width:600px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;gap:8px;margin-bottom:10px}.seg button{flex:1}.seg button.on{background:var(--ink);color:var(--bg)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.f .w{grid-column:1/-1}
#amt{font-size:28px;font-weight:700;text-align:center}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.set input{width:100%}.set button{width:100%;margin-top:8px}.danger{color:var(--red)}
.note{color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
<div class="top"><h1>💰 Money Manager</h1><button class="ic" id="gear" aria-label="Settings">⚙️</button></div>

<section class="view on" id="v-home">
  <div class="card big"><small id="tdl">Spent today</small><b id="tdv">0</b></div>
  <div class="card"><h2>Monthly budget</h2><div id="hb"></div></div>
  <div class="card"><h2>Today's items</h2><div id="hl"></div></div>
</section>

<section class="view" id="v-hist">
  <div class="mn"><button class="ic mp" aria-label="Previous month">‹</button><span class="ml"></span><button class="ic mnx" aria-label="Next month">›</button></div>
  <div id="hh"></div>
</section>

<section class="view" id="v-sum">
  <div class="mn"><button class="ic mp" aria-label="Previous month">‹</button><span class="ml"></span><button class="ic mnx" aria-label="Next month">›</button></div>
  <div class="card g"><div><small>Income</small><b id="sIn" style="color:var(--acc)"></b></div><div><small>Spent</small><b id="sOut" style="color:var(--out)"></b></div><div><small>Saved</small><b id="sSv"></b></div></div>
  <div class="card"><h2>Budget</h2><div id="sb"></div></div>
  <div class="card g g2"><div><small>Daily average</small><b id="avg"></b></div><div><small>Highest day</small><b id="hi"></b></div></div>
  <div class="card"><h2>Spending by category</h2><div id="sc"></div></div>
</section>

<section class="view set" id="v-set">
  <div class="card">
    <h2>Budget for <span id="bm"></span></h2>
    <input id="bud" type="number" inputmode="decimal" min="0" placeholder="Monthly budget">
    <label for="cur">Currency symbol</label>
    <input id="cur" maxlength="4">
  </div>
  <div class="card">
    <h2>Backup</h2>
    <p class="note">Your data is saved only on this phone. Export a backup file now and then, and use Import to restore it or move to a new phone.</p>
    <button id="exp" type="button">Export backup</button>
    <button id="imp" type="button">Import backup</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <p class="note" id="msg"></p>
  </div>
  <div class="card"><button id="wipe" class="danger" type="button" style="margin:0;width:100%">Delete all data</button></div>
</section>
</main>

<nav class="tabs">
  <button data-v="home" class="on"><span>🏠</span>Home</button>
  <button data-v="hist"><span>📅</span>History</button>
  <button class="add" id="addb" aria-label="Add"><span>＋</span></button>
  <button data-v="sum"><span>📊</span>Summary</button>
</nav>

<div class="ov" id="ov"><div class="sh">
  <div class="seg"><button id="tE" class="on" type="button">Expense</button><button id="tI" type="button">Income</button></div>
  <input id="amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0" style="width:100%;margin-bottom:10px">
  <div class="f"><select id="cat" aria-label="Category"></select><input id="date" type="date" aria-label="Date"><input id="note" class="w" placeholder="Note (optional), e.g. burger"></div>
  <div class="seg"><button id="cancel" type="button">Cancel</button><button id="save" class="p" type="button">Save</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const CATS={e:["Food","Transport","Charity","Bills","Shopping","Health","Rent","Entertainment","Education","Other"],i:["Salary","Business","Gift","Other"]};
const tdy=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let D={tx:[],bud:{},cur:"৳"},view="home",type="e",m=tdy().slice(0,7);
try{const s=JSON.parse(localStorage.getItem("mm_data")||"null");if(s&&Array.isArray(s.tx))D={tx:s.tx,bud:s.bud||{},cur:s.cur||"৳"}}catch(e){}
const save=()=>{try{localStorage.setItem("mm_data",JSON.stringify(D))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>D.cur+(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const mname=k=>new Date(k+"-01T00:00").toLocaleDateString(undefined,{month:"long",year:"numeric"});
const dname=d=>new Date(d+"T00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0);

function stats(mo){
  const list=D.tx.filter(t=>t.date.startsWith(mo)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const dt={},by={};list.filter(t=>t.type==="e").forEach(t=>{dt[t.date]=(dt[t.date]||0)+t.amount;by[t.category]=(by[t.category]||0)+t.amount});
  return{list,inc:sum(list,"i"),out:sum(list,"e"),dt,by};
}
function budHTML(mo,out){
  const b=D.bud[mo]||0;
  if(!b)return'<div class="note">No budget set. Tap ⚙️ to set one.</div>';
  const o=out>b;
  return`<div class="bar${o?" over":""}"><i style="width:${Math.min(100,out/b*100)}%"></i></div><div class="st"><span style="${o?"color:var(--red)":""}">${o?"Extra spending: "+money(out-b):"Left: "+money(b-out)}</span><span>${Math.round(out/b*100)}% of ${money(b)}</span></div>`;
}
const row=t=>`<div class="tx"><div class="m"><div>${esc(t.note||t.category)}</div><small>${esc(t.category)}</small></div><span class="amt ${t.type}">${t.type==="e"?"−":"+"}${money(t.amount)}</span><button class="x" data-id="${t.id}" aria-label="Delete">✕</button></div>`;

function render(){
  const td=tdy(),cm=td.slice(0,7),cs=stats(cm);
  $("tdv").textContent=money(sum(D.tx.filter(t=>t.date===td),"e"));
  $("tdl").textContent="Spent today · "+dname(td);
  $("hb").innerHTML=budHTML(cm,cs.out);
  const tl=D.tx.filter(t=>t.date===td).sort((a,b)=>b.id.localeCompare(a.id));
  $("hl").innerHTML=tl.length?tl.map(row).join(""):'<div class="empty">Nothing yet today. Tap ＋ to add.</div>';
  document.querySelectorAll(".ml").forEach(e=>e.textContent=mname(m));
  const s=stats(m),days={};s.list.forEach(t=>(days[t.date]=days[t.date]||[]).push(t));
  $("hh").innerHTML=s.list.length?Object.keys(days).map(d=>`<div class="card" style="padding:10px 14px"><div class="dh"><b>${dname(d)}</b><span>${s.dt[d]?money(s.dt[d]):""}</span></div>${days[d].map(row).join("")}</div>`).join(""):'<div class="empty">No entries this month</div>';
  $("sIn").textContent=money(s.inc);$("sOut").textContent=money(s.out);$("sSv").textContent=money(s.inc-s.out);
  $("sb").innerHTML=budHTML(m,s.out);
  const[y,mo]=m.split("-").map(Number),n=new Date(),dim=new Date(y,mo,0).getDate(),el=(y===n.getFullYear()&&mo===n.getMonth()+1)?n.getDate():dim;
  $("avg").textContent=money(s.out/el);
  const ks=Object.keys(s.dt);
  $("hi").textContent=ks.length?(()=>{const h=ks.reduce((a,k)=>s.dt[k]>s.dt[a]?k:a);return money(s.dt[h])+" · "+new Date(h+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"})})():"—";
  const rs=Object.entries(s.by).sort((a,b)=>b[1]-a[1]);
  $("sc").innerHTML=rs.length?rs.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><span>${money(v)} · ${Math.round(v/s.out*100)}%</span></div><div class="cb"><i style="width:${v/s.out*100}%"></i></div>`).join(""):'<div class="empty">No spending this month</div>';
  $("bm").textContent=mname(cm);
  if(document.activeElement!==$("bud"))$("bud").value=D.bud[cm]||"";
  if(document.activeElement!==$("cur"))$("cur").value=D.cur;
}
function go(v){
  view=v;document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id==="v-"+v));
  document.querySelectorAll(".tabs [data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  window.scrollTo(0,0);
}
document.querySelectorAll(".tabs [data-v]").forEach(b=>b.onclick=()=>go(b.dataset.v));
$("gear").onclick=()=>go(view==="set"?"home":"set");
const shift=n=>{const[y,mo]=m.split("-").map(Number),d=new Date(y,mo-1+n,1);m=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()};
document.querySelectorAll(".mp").forEach(b=>b.onclick=()=>shift(-1));
document.querySelectorAll(".mnx").forEach(b=>b.onclick=()=>shift(1));

function fillCat(){$("cat").innerHTML=CATS[type].map(c=>`<option>${c}</option>`).join("")}
function setType(t){type=t;$("tE").className=t==="e"?"on":"";$("tI").className=t==="i"?"on":"";fillCat()}
$("tE").onclick=()=>setType("e");$("tI").onclick=()=>setType("i");
$("addb").onclick=()=>{setType("e");$("date").value=tdy();$("amt").value="";$("note").value="";$("ov").classList.add("on");setTimeout(()=>$("amt").focus(),50)};
$("cancel").onclick=()=>$("ov").classList.remove("on");
$("ov").onclick=e=>{if(e.target===$("ov"))$("ov").classList.remove("on")};
$("save").onclick=()=>{
  const a=parseFloat($("amt").value);if(!(a>0)){$("amt").focus();return}
  D.tx.push({id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type,amount:a,category:$("cat").value,date:$("date").value||tdy(),note:$("note").value.trim()});
  save();$("ov").classList.remove("on");render();
};
document.addEventListener("click",e=>{
  const b=e.target.closest(".x");if(!b)return;
  if(b.dataset.sure){D.tx=D.tx.filter(t=>t.id!==b.dataset.id);save();render()}
  else{b.dataset.sure="1";b.textContent="Delete?";b.style.color="var(--red)";setTimeout(()=>{b.dataset.sure="";b.textContent="✕";b.style.color=""},3000)}
});
$("bud").onchange=()=>{D.bud[tdy().slice(0,7)]=parseFloat($("bud").value)||0;save();render()};
$("cur").oninput=()=>{D.cur=$("cur").value||"৳";save();render()};
$("exp").onclick=async()=>{
  const json=JSON.stringify({app:"money-manager",v:1,...D}),name="money-manager-"+tdy()+".json",P=window.Capacitor&&Capacitor.Plugins;
  try{
    if(P&&P.Filesystem&&P.Share){
      const r=await P.Filesystem.writeFile({path:name,data:json,directory:"CACHE",encoding:"utf8"});
      await P.Share.share({title:"Money Manager backup",url:r.uri,dialogTitle:"Save or send your backup"});
      $("msg").textContent="Backup ready. Choose where to save it (Drive, WhatsApp, Files...).";
    }else{
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));
      a.download=name;document.body.appendChild(a);a.click();a.remove();$("msg").textContent="Backup downloaded.";
    }
  }catch(e){$("msg").textContent="Could not export: "+(e&&e.message?e.message:"cancelled")}
};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.tx))throw 0;
    const ids=new Set(D.tx.map(t=>t.id));j.tx.forEach(t=>{if(t&&t.id&&t.date&&t.amount>0&&!ids.has(t.id))D.tx.push(t)});
    Object.assign(D.bud,j.bud||{});save();render();$("msg").textContent="Imported "+j.tx.length+" entries."}catch(x){$("msg").textContent="That file isn't a valid backup."}};
  r.readAsText(f);e.target.value="";
};
$("wipe").onclick=()=>{
  const b=$("wipe");
  if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Tap again to delete EVERYTHING";setTimeout(()=>{b.dataset.sure="";b.textContent="Delete all data"},4000);return}
  D.tx=[];D.bud={};save();b.dataset.sure="";b.textContent="All data deleted";setTimeout(()=>b.textContent="Delete all data",2500);render();
};
fillCat();render();
</script>
</body>
</html>
